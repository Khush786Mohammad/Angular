<div class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Login</h1>
    <p class="intro">Sign in to access your notes and manage your account.</p>
    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
      <div class="form-field">
        <label for="username">Username</label>
        <input
          type="text"
          required
          name="username"
          autocomplete="username"
          placeholder="Enter your username"
          #username="ngModel"
          [(ngModel)]="authForm.username"
        />
        @if (username?.invalid && username?.touched) {
          <small class="field-error">Please enter a username.</small>
        }
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <div class="password-input">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            #password="ngModel"
            required
            [(ngModel)]="authForm.password"
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
              @if (showPassword) {
                <path d="m3 3 18 18" />
              }
            </svg>
          </button>
        </div>
        @if (password?.invalid && password?.touched) {
          <small class="field-error">Please enter a password.</small>
        }
      </div>
      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>

    <p class="register-prompt">
      Doesn't have an account? <a routerLink="/auth/register">Register</a>
    </p>
  </section>
</div>
