<div class="notes-editor">
  <div class="editor-header">
    <h2 class="editor-title">{{ header }}</h2>
    <div class="action-buttons">
      <button
        type="button"
        class="btn icon-button cancel-btn"
        (click)="closed.emit()"
        aria-label="Close editor"
        title="Close editor"
      >
        <span aria-hidden="true">×</span>
      </button>
      <button
        type="submit"
        form="notesForm"
        class="btn icon-button save-btn"
        aria-label="Save note"
        [title]="mode === 'new' ? 'Save note' : 'Update note'"
      >
        <span aria-hidden="true">&#128190;</span>
      </button>
    </div>
  </div>
  <form id="notesForm" #notesForm="ngForm" (ngSubmit)="onSubmit(notesForm)">
    <div class="form-group">
      <label for="title" class="visually-hidden">Title</label>
      <input
        type="text"
        class="title-input"
        id="title"
        name="title"
        [(ngModel)]="note.title"
        placeholder="Enter title of your notes"
        required
      />
    </div>
    <div class="form-group">
      <label for="content" class="visually-hidden">Content</label>
      <textarea
        id="content"
        class="content-input"
        name="content"
        [(ngModel)]="note.content"
        placeholder="Start writing about the content..."
        required
      ></textarea>
    </div>
  </form>
</div>
