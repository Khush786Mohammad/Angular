<nav class="navbar" aria-label="Main navigation">
  <div class="logo">
    <a class="navbar__brand">Notes API</a>
  </div>
  <div class="navbar-search">
    <label for="search" class="visually-hidden">Search</label>
    <input
      type="text"
      id="search"
      class="search-box"
      name="search"
      placeholder="Search..."
    />
    <span class="material-symbols-outlined" aria-hidden="true">search</span>
  </div>
  <div class="navbar-actions">
    <div class="theme-mode">
      <button
        type="button"
        [class.current-mode]="currentTheme === 'dark'"
        id="light-mode"
        aria-label="Switch to light mode"
        (click)="setTheme('light')"
      >
        ☀️
      </button>
      <button
        type="button"
        [class.current-mode]="currentTheme === 'light'"
        id="dark-mode"
        aria-label="Switch to dark mode"
        (click)="setTheme('dark')"
      >
        🌙
      </button>
    </div>
    <div class="account-section">
      <button type="button" class="user-profile" aria-label="User profile">
        KM
      </button>
      <div class="user-profile-dropdown">
        <ul>
          <li class="profile-name">Khush</li>
          <li class="profile-username">khush786moh</li>
          <li class="profile-session">
            Session expires in:
            <strong
              [class.session-time-safe]="authService.remainingTimeStatus() === 'safe'"
              [class.session-time-warning]="authService.remainingTimeStatus() === 'warning'"
              [class.session-time-critical]="authService.remainingTimeStatus() === 'critical'"
              >{{ authService.remainingTime() }}</strong
            >
          </li>
          <li class="profile-logout">Logout</li>
        </ul>
      </div>
    </div>
  </div>
</nav>
